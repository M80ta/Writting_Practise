[package]
name = "letter-lines"
version = "0.1.0"
edition = "2024"
description = "A local, printable English handwriting worksheet studio"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
serde_json = "1"
